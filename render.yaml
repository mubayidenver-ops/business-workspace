services:
  - type: web
    name: business-workspace-lordyvites
    runtime: node
    repo: https://github.com/mubayidenver-ops/business-workspace
    branch: main
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.mjs
    healthCheckPath: /api/health
    disk:
      name: workspace-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: 'true'
